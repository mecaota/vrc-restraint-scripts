name: Build Repo Listing

# Builds the VPM repository listing (index.json) from the GitHub Releases and the
# landing page (index.html) from README.md, then deploys both to GitHub Pages.
# LISTING_URL must be the public URL of index.json, including the custom domain
# configured for GitHub Pages.
env:
  LISTING_URL: https://github.pito.run/vrc-restraint-scripts/index.json
  SITE_DIR: _site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - Website/**
      - .github/scripts/**
      - .github/workflows/build-listing.yml
  workflow_run:
    workflows: [Build Release]
    types:
      - completed
  release:
    types: [published, created, edited, unpublished, deleted, released]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # Build the VPM listing and the website
  build:
    name: build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Build listing and website
        run: node .github/scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_DIR }}

  # Deploy the uploaded website to GitHub Pages (only allowed from main)
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
